};

// KML: თითო ობიექტი = Placemark (კონტური ან წერტილი), ფერი სტატუსისა
function buildKml() {
  const xml = (text) => String(text == null ? '' : text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const kmlColor = (hex, alpha) => { const h = hex.replace('#', ''); return alpha + h.slice(4, 6) + h.slice(2, 4) + h.slice(0, 2); };
  const ring = (coordinates) => '<LinearRing><coordinates>' + coordinates.map(([lng, lat]) => lng + ',' + lat + ',0').join(' ') + '</coordinates></LinearRing>';
  const polygonKml = (rings) => '<Polygon><outerBoundaryIs>' + ring(rings[0]) + '</outerBoundaryIs>' + rings.slice(1).map((r) => '<innerBoundaryIs>' + ring(r) + '</innerBoundaryIs>').join('') + '</Polygon>';
  const rows = exportRows();
  let placemarks = '';
  renderedObjects.forEach((object, index) => {
    const color = object.view.color;
    const style = '<Style><LineStyle><color>' + kmlColor(color, 'ff') + '</color><width>2</width></LineStyle><PolyStyle><color>' + kmlColor(color, '80') + '</color></PolyStyle>' +
      '<IconStyle><color>' + kmlColor(color, 'ff') + '</color></IconStyle></Style>';
    const description = Object.entries(rows[index]).filter(([, value]) => value !== '').map(([key, value]) => key + ': ' + value).join('\n');
    let geometry = '';
    if (object.geometry) {
      const polygons = object.geometry.type === 'MultiPolygon' ? object.geometry.coordinates : [object.geometry.coordinates];
      geometry = polygons.length > 1 ? '<MultiGeometry>' + polygons.map(polygonKml).join('') + '</MultiGeometry>' : polygonKml(polygons[0]);
    } else if (object.centroid) {
      geometry = '<Point><coordinates>' + object.centroid.lng + ',' + object.centroid.lat + ',0</coordinates></Point>';
    } else return;
    placemarks += '<Placemark><name>' + xml(objectTitle(object)) + '</name><description>' + xml(description) + '</description>' + style + geometry + '</Placemark>\n';
  });
  return XML_HEAD + '\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' + xml(exportFileName('kml')) + '</name>\n' + placemarks + '</Document></kml>\n';
}

// ---------- მინიმალური .xlsx (ZIP შეკუმშვის გარეშე), გარე ბიბლიოთეკის გარეშე ----------
function buildXlsx(rows) {
  const xml = (text) => String(text == null ? '' : text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const headers = Object.keys(rows[0]);
  const columnName = (index) => { let name = ''; index++; while (index) { const r = (index - 1) % 26; name = String.fromCharCode(65 + r) + name; index = Math.floor((index - 1) / 26); } return name; };
  const cell = (value, rowNumber, columnIndex, bold) => {
    const ref = columnName(columnIndex) + rowNumber;
    if (typeof value === 'number') return '<c r="' + ref + '"><v>' + value + '</v></c>';
    return '<c r="' + ref + '" t="inlineStr"' + (bold ? ' s="1"' : '') + '><is><t xml:space="preserve">' + xml(value) + '</t></is></c>';
  };
  let sheetRows = '<row r="1">' + headers.map((header, i) => cell(header, 1, i, true)).join('') + '</row>';
  rows.forEach((row, r) => { sheetRows += '<row r="' + (r + 2) + '">' + headers.map((header, i) => cell(row[header], r + 2, i)).join('') + '</row>'; });
  const widths = headers.map((header, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + Math.min(45, Math.max(12, header.length + 4, ...rows.map((row) => String(row[header]).length + 2))) + '" customWidth="1"/>').join('');
  const files = {
    '[Content_Types].xml': XML_HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels': XML_HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml': XML_HEAD + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="ობიექტები" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels': XML_HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml': XML_HEAD + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>',
    'xl/worksheets/sheet1.xml': XML_HEAD + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>' + widths + '</cols><sheetData>' + sheetRows + '</sheetData></worksheet>',
  };
  return new Blob([zipStore(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// ZIP არქივი შეკუმშვის გარეშე („stored“), CRC32-ით
function zipStore(files) {
  const encoder = new TextEncoder();
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc32 = (bytes) => { let c = 0xFFFFFFFF; for (const b of bytes) c = crcTable[(c ^ b) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let offset = 0;
  for (const [name, text] of Object.entries(files)) {
    const nameBytes = encoder.encode(name), data = encoder.encode(text), crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
    local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true); local.setUint16(26, nameBytes.length, true);
    parts.push(new Uint8Array(local.buffer), nameBytes, data);
    const header = new DataView(new ArrayBuffer(46));
    header.setUint32(0, 0x02014b50, true); header.setUint16(4, 20, true); header.setUint16(6, 20, true); header.setUint16(8, 0x0800, true);
    header.setUint32(16, crc, true); header.setUint32(20, data.length, true); header.setUint32(24, data.length, true); header.setUint16(28, nameBytes.length, true);
    header.setUint32(42, offset, true);
    central.push(new Uint8Array(header.buffer), nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }
  const centralSize = central.reduce((sum, part) => sum + part.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, centralSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)]);
}

// ---------- საჯარო View-ები ----------
// საჯარო ბმული Google ანგარიშს არ ითხოვს, ამიტომ მას მთელი Sheet არ ეძლევა: გამოქვეყნებისას
// ვინახავთ მხოლოდ ამ ხედში ნაჩვენები ობიექტების ასლს, საფუძვლების, ნომრებისა და შენიშვნების გარეშე.
// options: showParty (მხარის სახელი), withHistory (false = მხოლოდ ამ თარიღის მდგომარეობა), withFlags (ნიშნები)
function buildPublicSnapshot(options) {
  const date = filterState.date;
  const contractIds = new Set();
  const objects = renderedObjects;
  objects.forEach((object) => object.view.entries.forEach((entry) => contractIds.add(entry.row.contract)));
  const objectKeys = new Set(objects.map((object) => object.key));
  const codes = new Set(objects.map((object) => object.code));
  const activeRows = new Set(objects.flatMap((object) => object.view.entries.map((entry) => entry.row)));
  const activeAt = (row) => row.from && row.from <= date && !(row.to && row.to <= date);
  let history = mapData.history.filter((row) => objectKeys.has(objectKey(row.code, row.part)) && contractIds.has(row.contract));
  let statusChanges = mapData.statusChanges.filter((change) => contractIds.has(change.contract)).map((change) => ({ contract: change.contract, date: change.date, status: change.status, basis: '' }));
  let restrictions = mapData.restrictions.filter((row) => objectKeys.has(objectKey(row.code, row.part)));
  let flags = options.withFlags ? mapData.flags.filter((row) => contractIds.has(row.contract)) : [];
  if (!options.withHistory) {
    // მხოლოდ ამ დღის სურათი: მოქმედი ჩანაწერები და თითო ხელშეკრულებაზე ერთი (მიმდინარე) სტატუსი
    history = history.filter((row) => activeRows.has(row));
    statusChanges = Array.from(contractIds).map((id) => ({ contract: id, date, status: contractStatusAt(id, date), basis: '' }));
    restrictions = restrictions.filter((row) => activeAt({ from: row.from || contractStart(contractsById[row.contract]), to: row.to }));
    flags = flags.filter(activeAt);
  }
  return {
    contracts: mapData.contracts.filter((c) => contractIds.has(c.id)).map((c) => ({
      id: c.id, type: c.type, party: options.showParty ? c.party : '', number: '', signed: c.signed, start: c.start, end: c.end, note: '' })),
    statusChanges,
    history: history.map((row) => ({ contract: row.contract, code: row.code, part: row.part, from: row.from, to: row.to, basis: '', plan: '' })),
    restrictions: restrictions.map((row) => ({
      code: row.code, part: row.part, contract: contractIds.has(row.contract) ? row.contract : '', condition: row.condition,
      from: row.from, to: row.to, basis: '', endBasis: '', endKind: row.endKind })),
    flags: flags.map((row) => ({ contract: row.contract, flag: row.flag, from: row.from, to: row.to, basis: '', note: '' })),
    flagTypes: options.withFlags ? mapData.flagTypes : [],
    statuses: mapData.statuses,
    // ობიექტის კონტური + მთლიანი კოდის კონტური (ნაწილის პინისთვის)
    geometries: mapData.geometries.filter((row) => objectKeys.has(objectKey(row.code, row.part)) || (!row.part && codes.has(String(row.code)))).map((row) => ({
      code: row.code, part: row.part, geojson: row.geojson, area: row.area })),
    views: [],
    fixedDate: options.withHistory ? '' : date,
    filter: filtersToQuery().toString(),
  };
}

function openModal(html) { byId('modal').innerHTML = html; byId('modalBack').classList.add('open'); }
function closeModal() { byId('modalBack').classList.remove('open'); }
byId('modalBack').addEventListener('click', (event) => { if (event.target.id === 'modalBack') closeModal(); });

function openPublishDialog() {
  const count = renderedObjects.length;
  if (!count) { showToast('ამ ხედში ობიექტი არ არის, გასაზიარებელი არაფერია.'); return; }
  let days = 7;
  const choices = [[1, '1 დღე'], [7, '7 დღე'], [30, '30 დღე'], [0, 'უვადოდ']];
  openModal('<h3>საჯაროდ გაზიარება</h3>' +
    '<div class="muted" style="font-size:13px">ბმულს Google ანგარიში არ სჭირდება. გაზიარდება მხოლოდ ამ ხედის ' + count + ' ობიექტი, ' +
    'ამჟამინდელი მდგომარეობით (ასლი). საფუძვლები, ნომრები და შენიშვნები არ გაიცემა.</div>' +
    '<label class="field">სახელი (ნახავს ბმულის მიმღებიც)</label><input type="text" id="publishName" placeholder="მაგ. აქტიური იჯარები რუსთაველზე">' +
    '<label class="field">ვადა</label><div class="segment" id="publishDays">' +
    choices.map(([value, label]) => '<button class="chip' + (value === days ? '' : ' off') + '" data-days="' + value + '">' + label + '</button>').join('') + '</div>' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13.5px"><input type="checkbox" id="publishParty"> მხარის (მოიჯარის და ა.შ.) სახელიც გამოჩნდეს</label>' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13.5px"><input type="checkbox" id="publishHistory"> ისტორიაც (თარიღის ზოლით); მოუნიშნავი = მხოლოდ ' + formatDate(filterState.date) + '-ის მდგომარეობა</label>' +
    (mapData.flags.length ? '<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13.5px"><input type="checkbox" id="publishFlags"> ნიშნებიც (დავალიანება, დარღვევა…)</label>' : '') +
    '<div class="row-buttons"><button class="action" id="publishCancel">გაუქმება</button><button class="action primary" id="publishGo">გამოქვეყნება</button></div>');
  byId('publishName').focus();
  byId('publishDays').querySelectorAll('[data-days]').forEach((button) => button.onclick = () => {
    days = Number(button.dataset.days);
    byId('publishDays').querySelectorAll('[data-days]').forEach((other) => other.classList.toggle('off', other !== button));
  });
  byId('publishCancel').onclick = closeModal;
  byId('publishGo').onclick = () => {
    const name = byId('publishName').value.trim();
    if (!name) { byId('publishName').focus(); showToast('სახელი ჩაწერე.'); return; }
    const snapshot = buildPublicSnapshot({ showParty: byId('publishParty').checked, withHistory: byId('publishHistory').checked, withFlags: !!(byId('publishFlags') && byId('publishFlags').checked) });
    byId('publishGo').disabled = true; byId('publishGo').textContent = 'ქვეყნდება…';
    callServer('publishView', [name, days, byId('publishParty').checked, JSON.stringify(snapshot)], (result) => {
      openModal('<h3>✓ გამოქვეყნდა</h3><div class="muted" style="font-size:13px">' + escapeHtml(name) + ' · ' +
        (result.expires ? 'მოქმედებს ' + formatDate(result.expires) + '-მდე' : 'უვადოდ') + '. გაუქმება: გაზიარება → საჯარო ბმულების მართვა.</div>' +
        '<div class="link-box" id="publicLinkBox">' + escapeHtml(result.link) + '</div>' +
        '<div class="row-buttons"><button class="action" id="publicClose">დახურვა</button><a class="action" href="' + escapeHtml(result.link) + '" target="_blank" rel="noopener">გახსნა ↗</a>' +
        '<button class="action primary" id="publicCopy">კოპირება</button></div>');
      byId('publicClose').onclick = closeModal;
      byId('publicCopy').onclick = () => copyText(result.link, 'საჯარო ბმული დაკოპირდა.');
    });
  };
}

function openPublicList() {
  openModal('<h3>საჯარო ბმულები</h3><div class="muted">იტვირთება…</div>');
  callServer('listPublicViews', [], (views) => {
    const rows = (views || []).slice().reverse().map((view, index) =>
      '<div class="public-row"><div class="grow"><div class="' + (view.active ? '' : 'off') + '">' + escapeHtml(view.name) + '</div>' +
      '<div class="muted" style="font-size:12px">' + (view.active ? (view.expires ? 'მოქმედებს ' + formatDate(view.expires) + '-მდე' : 'უვადო') : 'აღარ მოქმედებს') + '</div></div>' +
      (view.active ? '<button class="action" data-copy="' + index + '">ბმული</button><button class="action" data-stop="' + index + '">გაუქმება</button>' : '') + '</div>');
    const list = (views || []).slice().reverse();
    openModal('<h3>საჯარო ბმულები</h3>' + (rows.length ? rows.join('') : '<div class="muted">ჯერ არაფერი გამოქვეყნებულა.</div>') +
      '<div class="row-buttons"><button class="action" id="publicListClose">დახურვა</button></div>');
    byId('publicListClose').onclick = closeModal;
    byId('modal').querySelectorAll('[data-copy]').forEach((button) => button.onclick = () => copyText(list[Number(button.dataset.copy)].link, 'ბმული დაკოპირდა.'));
    byId('modal').querySelectorAll('[data-stop]').forEach((button) => button.onclick = () => {
      const view = list[Number(button.dataset.stop)];
      button.disabled = true;
      callServer('unpublishView', [view.token], () => { showToast('„' + view.name + '“ გაუქმდა: ბმული აღარ გაიხსნება.'); openPublicList(); });
    });
  });
}

// ---------- სერვერთან კავშირი ----------
function callServer(name, args, onSuccess) {
  if (window.LOCAL_SERVER) { onSuccess(window.LOCAL_SERVER[name].apply(null, args)); return; } // ლოკალური ტესტი
  Promise.resolve().then(() => window.SERVER[name].apply(null, args)).then(onSuccess, (error) => {
    byId('loading').style.display = 'none';
    if (name === 'getPublicView') { byId('loading').style.display = 'flex'; byId('loading').textContent = (error && error.message) || 'ბმული აღარ მოქმედებს.'; return; }
    showToast('შეცდომა: ' + (error && error.message ? error.message : error), 8000);
  });
}

// ---------- ჩატვირთვა ----------
// Sheet-ის ახალი მდგომარეობის ძალით წაკითხვა (ქეშის გვერდის ავლით); ფილტრები და რუკის ხედი რჩება
function refreshData() {
  byId('loading').style.display = 'flex';
  callServer('getMapData', [true], (data) => {
    const keep = Object.fromEntries(filtersToQuery());
    const selectedKey = selectedObject ? selectedObject.key : null;
    prepareData(data);
    applyQuery(keep);
    buildFilterControls();
    selectedObject = selectedKey ? mapObjects.find((object) => object.key === selectedKey) || null : null;
    render();
    byId('loading').style.display = 'none';
    showToast('მონაცემი განახლდა.');
  });
}

function start(parameters) {
  const publicMode = !!window.PUBLIC_TOKEN;
  callServer(publicMode ? 'getPublicView' : 'getMapData', publicMode ? [window.PUBLIC_TOKEN] : [], (data) => {
    if (!data) { byId('loading').textContent = 'ეს საჯარო ბმული აღარ მოქმედებს.'; return; }
    prepareData(data);
    if (publicMode) {
      document.body.classList.add('public-mode');
      if (data.fixedDate) document.body.classList.add('fixed-date');
      const expires = data.publicInfo.expires;
      byId('publicBanner').innerHTML = '🌐 <b>' + escapeHtml(data.publicInfo.name) + '</b>' +
        '<span class="full"> · საჯარო ხედი' + (data.fixedDate ? ', მდგომარეობა ' + formatDate(data.fixedDate) + '-ით' : '') + (expires ? ', ბმული მოქმედებს ' + formatDate(expires) + '-მდე' : '') + '</span>' +
        '<span class="short">' + (expires ? ' · ' + formatDate(expires).slice(0, 5) + '-მდე' : '') + '</span>';
      byId('publicBanner').title = 'საჯარო ხედი' + (expires ? ', მოქმედებს ' + formatDate(expires) + '-მდე' : '');
      byId('publicBanner').onclick = () => byId('publicBanner').classList.toggle('expanded');
      // ბმულში საკუთარი პარამეტრები თუ არ არის, ავტორის დაყენებული ფილტრი ჩაირთოს
      const own = Object.keys(parameters || {}).filter((key) => key !== 'view');
      if (!own.length && data.filter) parameters = Object.fromEntries(new URLSearchParams(data.filter));
    }
    if (data.noAccess) {
      // ხელშეკრულებების გარეშე: სუფთა რუკა (ფენები, საკადასტრო ფენა, ძებნა რუკაზე)
      document.body.classList.add('public-mode');
      byId('publicBanner').innerHTML = data.noAccess === 'anonymous'
        ? 'ხელშეკრულებები არ ჩანს: შესვლის გარეშე ხარ. <a href="#" id="bannerSignIn">შესვლა</a>'
        : 'ხელშეკრულებები არ ჩანს: Sheet შენთვის გაზიარებული არ არის.';
      if (byId('bannerSignIn')) byId('bannerSignIn').onclick = (event) => { event.preventDefault(); location.reload(); };
    }
    applyQuery(parameters || {});
    buildFilterControls();
    render();
    byId('loading').style.display = 'none';
    if (isPhone()) byId('results').classList.add('collapsed');
    if (!(parameters && parameters.map) && renderedObjects.some((object) => object.centroid)) {
      map.fitBounds(L.latLngBounds(renderedObjects.filter((object) => object.centroid).map((object) => object.centroid)).pad(0.15));
    }
  });
}

start(Object.fromEntries(new URLSearchParams(location.search)));
</script>
