// ---------- სამუშაო მაგიდა: ძებნა ხელშეკრულებების გარეთ ----------
const CODE_RE = /^\d{1,2}(\.\d{1,3}){2,9}[ა-ჰ]?$/;

// WKT (POLYGON / MULTIPOLYGON, გრძედი განედი) → GeoJSON
function wktToGeoJSON(wkt) {
  const text = String(wkt || '').trim();
  const type = text.match(/^(MULTIPOLYGON|POLYGON)/i);
  if (!type) return null;
  const json = text.slice(text.indexOf('(')).replace(/\(/g, '[').replace(/\)/g, ']')
    .replace(/(-?\d+(?:\.\d+)?(?:e-?\d+)?)\s+(-?\d+(?:\.\d+)?(?:e-?\d+)?)(?:\s+-?\d+(?:\.\d+)?)?/gi, '[$1,$2]');
  try { return { type: type[1].toUpperCase() === 'POLYGON' ? 'Polygon' : 'MultiPolygon', coordinates: JSON.parse(json) }; } catch (error) { return null; }
}

function workStyle(item) {
  return { color: item.color, weight: 3, dashArray: '7 5', fillColor: item.color, fillOpacity: 0.12, opacity: 1 };
}

function renderWork() {
  if (workLayer) workLayer.remove();
  workLayer = L.featureGroup().addTo(map);
  for (const item of workItems) {
    item.layer = L.geoJSON(item.geometry, { style: workStyle(item),
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, Object.assign(workStyle(item), { radius: 7, dashArray: null, fillOpacity: 0.5 })) })
      .bindTooltip('<b>' + escapeHtml(item.code) + '</b><br>' + escapeHtml(item.source), { sticky: true, className: 'object-tooltip', direction: 'top' });
    if (item.hidden) { item.editing = false; continue; } // დამალული (👁): რუკაზე არ იხატება, სიაში რჩება
    item.layer.addTo(workLayer);
    // პოლიგონზე დაჭერა: „მხოლოდ შიგნით მოქცეულები“ (ამ ნაწილის ან მთლიანი ფაილის)
    if (!item.editing && contractsOn) item.layer.on('click', (event) => {
      const shape = event.layer || event.sourceTarget;
      const shapeGeometry = shape && shape.toGeoJSON ? shape.toGeoJSON(false).geometry : null;
      if (!outerRingsOf(shapeGeometry).length && !outerRingsOf(item.geometry).length) return;
      L.DomEvent.stopPropagation(event);
      const several = outerRingsOf(item.geometry).length > outerRingsOf(shapeGeometry).length;
      const popup = L.popup({ className: 'area-popup', maxWidth: 260 }).setLatLng(event.latlng).setContent(
        '<b>' + escapeHtml(item.code) + '</b><div style="display:grid;gap:6px;margin-top:8px">' +
        (outerRingsOf(shapeGeometry).length ? '<button class="action primary" data-popup-area="shape">⬚ მხოლოდ შიგნით მოქცეულები</button>' : '') +
        (several ? '<button class="action" data-popup-area="all">⬚ მთლიანი ფაილის შიგნით</button>' : '') + '</div>').openOn(map);
      popup.getElement().querySelectorAll('[data-popup-area]').forEach((button) => button.onclick = () => {
        map.closePopup(popup);
        useAsArea(button.dataset.popupArea === 'shape' ? shapeGeometry : item.geometry, item.code);
      });
    });
    // წვეროების შესწორება: ✎ ღილაკით ჩაირთვება, ცვლილება item.geometry-ში ინახება
    if (item.editing) item.layer.eachLayer((shape) => {
      shape.pm.enable({ allowSelfIntersection: true });
      shape.on('pm:edit', () => { item.geometry = shape.toGeoJSON(false).geometry; item.edited = true; updateWorkTitle(); });
    });
  }
  const panel = byId('workPanel');
  panel.classList.toggle('visible', workItems.length > 0 || !!planMenu || !!currentMap);
  panel.innerHTML = '<div class="work-title"><span style="flex:1;min-width:0" id="workTitleText">' + workTitleHtml() + '</span>' +
    (workItems.length ? '<button class="icon-button" id="workShare" title="გაზიარება ბმულით (ასლი)">🔗</button>' +
      '<button class="icon-button" id="workSave" title="' + (currentMap ? 'შენახვა: „' + escapeHtml(currentMap.name) + '“' : 'შენახვა „ჩემს რუკებში“') + '">💾</button>' : '') +
    '<button class="icon-button eye' + (workItems.length && workItems.every((item) => item.hidden) ? ' off' : '') + '" id="workEyeAll" title="ყველას დამალვა / ჩვენება">👁</button>' +
    '<button class="icon-button" id="workClear" title="' + (currentMap ? 'რუკის დახურვა (შენახული რჩება)' : 'ყველას წაშლა') + '">✕</button></div>' +
    workItems.map((item, index) => '<div class="work-item" data-index="' + index + '">' +
      (workItems.length > 1 ? '<span class="drag-handle" data-drag="' + index + '" title="გადაათრიე სიაში (ზემოთ = რუკაზე ქვემოთ)">⋮⋮</span>' : '') +
      // ფერის ღილაკი: დაჭერით იხსნება ფერის ამომრჩევი
      '<label class="swatch" title="ფერის შეცვლა" style="border-color:' + item.color + ';background:' + item.color + '22">' +
      '<input type="color" data-color="' + index + '" value="' + item.color + '"></label>' +
      '<div class="grow"><div><b>' + escapeHtml(item.code) + '</b></div><div class="sub">' + escapeHtml(item.source) + (item.edited ? ' · შესწორებული' : '') +
      (item.areaText ? ' · ' + escapeHtml(item.areaText) : '') + (item.address ? ' · ' + escapeHtml(item.address) : '') + '</div>' +
      (item.warnings && item.warnings.length ? '<div class="warn">⚠ ' + item.warnings.map(escapeHtml).join(' ') + '</div>' : '') + '</div>' +
      '<button class="icon-button eye' + (item.hidden ? ' off' : '') + '" data-eye="' + index + '" title="' + (item.hidden ? 'ჩვენება' : 'დამალვა') + '">👁</button>' +
      (CODE_RE.test(item.code) ? '<button class="icon-button' + (planMenu && planMenu.code === item.code ? ' on' : '') + '" data-plans="' + index + '" title="საკადასტრო გეგმები: კონტური გეგმიდან, შედარება">📄</button>' : '') +
      (item.editing
        ? '<button class="icon-button on" data-edit="' + index + '" title="შესწორების დასრულება (შენახვა)">✓</button>' +
          '<button class="icon-button" data-cancel="' + index + '" title="შესწორების გაუქმება (Esc)">↶</button>'
        : /^(Multi)?(Polygon|LineString)$/.test(item.geometry.type) ? '<button class="icon-button" data-edit="' + index + '" title="წვეროების შესწორება">✎</button>' : '') +
      (canSaveToContract(item) ? '<button class="icon-button" data-save="' + index + '" title="ხელშეკრულების ქონების კონტურად შენახვა („გეომეტრიები“)">💾</button>' : '') +
      (contractsOn && outerRingsOf(item.geometry).length ? '<button class="icon-button" data-area="' + index + '" title="მხოლოდ ამის შიგნით მოქცეული ქონებები">⬚</button>' : '') +
      '<button class="icon-button" data-copy="' + index + '" title="კოდის კოპირება">⧉</button>' +
      '<button class="icon-button" data-remove="' + index + '" title="წაშლა">✕</button></div>').join('') +
    planMenuHtml();
  byId('workClear').onclick = () => {
    if (currentMap && mapIsDirty() && !window.confirm('„' + currentMap.name + '“-ში შეუნახავი ცვლილებებია. დავხურო შენახვის გარეშე?')) return;
    workItems = []; planMenu = null; currentMap = null; clearShared(); renderWork();
  };
  if (byId('workSave')) byId('workSave').onclick = () => currentMap ? saveWorkspace(currentMap.name, false) : openMyMaps(true);
  if (byId('workShare')) byId('workShare').onclick = () => openShareMapDialog(currentMap ? currentMap.name : sharedMap || 'სამუშაო მაგიდა', workItems);
  byId('workEyeAll').onclick = () => { const hide = !workItems.every((item) => item.hidden); workItems.forEach((item) => item.hidden = hide); renderWork(); };
  panel.querySelectorAll('[data-plan-number]').forEach((button) => button.onclick = () => addPlanContour(planMenu.code, Number(button.dataset.planNumber)));
  if (byId('planMenuClose')) byId('planMenuClose').onclick = () => { planMenu = null; renderWork(); };
  panel.querySelectorAll('input[data-color]').forEach((input) => {
    input.onclick = (event) => event.stopPropagation(); // ზუმი არ მოხდეს
    input.oninput = () => {
      const item = workItems[Number(input.dataset.color)];
      item.color = input.value;
      item.layer.setStyle(workStyle(item));
      updateWorkTitle();
      input.parentElement.style.borderColor = item.color;
      input.parentElement.style.background = item.color + '22';
    };
  });
  // სიაში გადათრევა (⋮⋮): მაუსითაც და თითითაც; რიგი = რუკაზე ხატვის რიგი (ბოლო ზემოდან ჩანს)
  panel.querySelectorAll('[data-drag]').forEach((handle) => handle.onpointerdown = (downEvent) => {
    downEvent.preventDefault();
    const from = Number(handle.dataset.drag);
    const rows = [...panel.querySelectorAll('.work-item')];
    let to = from;
    rows[from].classList.add('dragging');
    handle.setPointerCapture(downEvent.pointerId);
    const move = (event) => {
      rows.forEach((row) => row.classList.remove('drop-before', 'drop-after'));
      to = rows.findIndex((row) => { const box = row.getBoundingClientRect(); return event.clientY < box.top + box.height / 2; });
      if (to === -1) { to = rows.length; rows[rows.length - 1].classList.add('drop-after'); } else rows[to].classList.add('drop-before');
      const panelBox = panel.getBoundingClientRect(); // სიის კიდესთან ავტომატური გადახვევა
      if (event.clientY < panelBox.top + 24) panel.scrollTop -= 10; else if (event.clientY > panelBox.bottom - 24) panel.scrollTop += 10;
    };
    const finish = () => {
      handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', finish); handle.removeEventListener('pointercancel', finish);
      const target = to > from ? to - 1 : to;
      if (target !== from) { const [moved] = workItems.splice(from, 1); workItems.splice(target, 0, moved); }
      renderWork();
    };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', finish); handle.addEventListener('pointercancel', finish);
  });
  panel.querySelectorAll('.work-item').forEach((element) => element.onclick = (event) => {
    if (event.target.dataset.drag) return;
    const item = workItems[Number(element.dataset.index)];
    if (event.target.dataset.remove) { workItems.splice(Number(event.target.dataset.remove), 1); renderWork(); return; }
    if (event.target.dataset.copy) { copyText(item.code, 'კოდი დაკოპირდა.'); return; }
    if (event.target.dataset.eye) { item.hidden = !item.hidden; renderWork(); return; }
    if (event.target.dataset.plans) { openPlanMenu(item.code); return; }
    if (item.hidden) { item.hidden = false; renderWork(); } // დამალულზე დაჭერა = ჩვენება და მიახლოება
    if (event.target.dataset.edit) { toggleWorkEdit(item); return; }
    if (event.target.dataset.cancel) { cancelWorkEdit(item); return; }
    if (event.target.dataset.save) { saveWorkItemToContract(item); return; }
    if (event.target.dataset.area) { useAsArea(item.geometry, item.code); return; }
    map.flyToBounds(item.layer.getBounds(), { maxZoom: 19, padding: [60, 60], duration: 0.8 });
  });
}

// სამუშაო მაგიდის პოლიგონი არეალად: რუკაზე და სიაში მხოლოდ მის შიგნით მოქცეული ქონებები
function useAsArea(geometry, name) {
  const rings = outerRingsOf(geometry);
  if (!rings.length) { showToast('არეალი მხოლოდ პოლიგონიდან შეიძლება.'); return; }
  setArea(rings, false, '⬚ ' + name);
  showToast('ჩანს მხოლოდ „' + name + '“-ის შიგნით მოქცეული ქონებები (' + renderedObjects.length + '). მოსახსნელად: ზემოთ ✕.');
}

async function searchOutside(code) {
  const existing = workItems.find((item) => item.code === code && item.source === 'ms.gov.ge');
  if (existing) { if (existing.hidden) { existing.hidden = false; renderWork(); } map.flyToBounds(existing.layer.getBounds(), { maxZoom: 19, padding: [60, 60], duration: 0.8 }); return; }
  showToast('ვეძებ რუკაზე: ' + code + '…', 10000);
  try {
    const data = window.LOCAL_SERVER && window.LOCAL_SERVER.searchCode ? window.LOCAL_SERVER.searchCode(code) : await window.SERVER.searchCode(code);
    const result = data && data.naprSearchResult;
    const geometry = result && wktToGeoJSON(result.wktShape);
    if (!geometry) { // კოდი რუკაზე აღარ არის: ვცდით საკადასტრო გეგმას (ავტომატურად ყველაზე ახალს)
      showToast(code + ': რუკაზე არ არის. ვიწერ ბოლო საკადასტრო გეგმას რეესტრიდან…', 60000);
      addLatestPlanContour(code);
      return;
    }
    const item = { id: Date.now(), code: result.cadCode || code, source: 'ms.gov.ge', address: result.address || result.fullAddress || '', geometry,
      color: WORK_COLORS[workItems.length % WORK_COLORS.length] };
    workItems.push(item);
    renderWork();
    map.flyToBounds(item.layer.getBounds(), { maxZoom: 19, padding: [60, 60], duration: 0.8 });
    showToast(code + ': კონტური დაემატა (დროებით).');
  } catch (error) {
    showToast('ძებნა ვერ მოხერხდა: ' + error.message, 8000);
  }
}

// ---------- სამუშაო მაგიდა: კონტური საკადასტრო გეგმიდან ----------
// გეგმების წაკითხვა და PDF → კონტური: js/plan/ (ექსთენშენის კოდი უცვლელად), იტვირთება პირველ საჭიროებაზე
let planMenu = null; // ღია სია: { code, state: 'loading'|'ready'|'error', plans, otherCount, error }
let planModule = null;
function loadPlanModule() {
  if (!planModule) planModule = import('./js/plan/plan_bridge.mjs').catch((error) => { planModule = null; throw error; });
  return planModule;
}
const dateFromMs = (ms) => {
  if (!ms) return '';
  const date = new Date(ms), two = (number) => String(number).padStart(2, '0');
  return two(date.getDate()) + '.' + two(date.getMonth() + 1) + '.' + date.getFullYear();
};
const squareMeters = (value) => Number.isFinite(value) ? (value < 100 ? value.toFixed(2) : String(Math.round(value)).replace(/\B(?=(\d{3})+$)/g, ' ')) + ' მ²' : '';

function planMenuHtml() {
  if (!planMenu) return '';
  let body;
  if (planMenu.state === 'loading') body = '<div class="sub">ყველა გეგმის სია იტვირთება ფონზე…</div>';
  else if (planMenu.state === 'error') body = '<div class="warn">' + escapeHtml(planMenu.error) + '</div>';
  else if (!planMenu.plans.length) body = '<div class="sub">საკადასტრო გეგმა არ არის' + (planMenu.otherCount ? ' (არის ' + planMenu.otherCount + ' სხვა ნახაზი)' : '') + '.</div>';
  else body = '<div class="chips">' + planMenu.plans.map((plan) => {
    const added = workItems.some((item) => item.code === planMenu.code && item.planNumber === plan.planNumber);
    return '<button class="plan-chip' + (added ? ' added' : '') + '" data-plan-number="' + plan.planNumber + '">' +
      plan.planNumber + (plan.planDateMs ? ' · ' + dateFromMs(plan.planDateMs) : '') + '</button>';
  }).join('') + '</div><div class="sub" style="margin-top:6px">1 = ყველაზე ახალი. რამდენიმეს არჩევით გვერდიგვერდ შეადარებ.</div>';
  return '<div class="plan-menu"><div class="head"><b style="flex:1">' + escapeHtml(planMenu.code) + ': საკადასტრო გეგმები</b>' +
    '<button class="icon-button" id="planMenuClose" title="დახურვა">✕</button></div>' + body + '</div>';
}

// გეგმების სიის გახსნა (ან დახურვა, თუ უკვე ღიაა). keepOpen: ავტომატური გამოძახება ძებნიდან.
// ბრუნდება გეგმების სია (ან null შეცდომისას).
async function openPlanMenu(code, keepOpen) {
  if (planMenu && planMenu.code === code && !keepOpen) { planMenu = null; renderWork(); return null; }
  planMenu = { code, state: 'loading' };
  renderWork();
  try {
    const bridge = await loadPlanModule();
    const result = await bridge.listPlans(code);
    if (planMenu && planMenu.code === code) { Object.assign(planMenu, { state: 'ready' }, result); numberPlanItems(); renderWork(); }
    return result.plans;
  } catch (error) {
    if (planMenu && planMenu.code === code) { planMenu.state = 'error'; planMenu.error = 'რეესტრი ვერ წავიკითხე: ' + error.message; renderWork(); }
    return null;
  }
}

async function addPlanContour(code, planNumber) {
  const existing = workItems.find((item) => item.code === code && item.planNumber === planNumber);
  if (existing) { if (existing.hidden) { existing.hidden = false; renderWork(); } map.flyToBounds(existing.layer.getBounds(), { maxZoom: 19, padding: [60, 60], duration: 0.8 }); return; }
  showToast(code + ': გეგმა ' + planNumber + ' გარდაიქმნება კონტურად…', 30000);
  try {
    const bridge = await loadPlanModule();
    const contour = await bridge.planContour(code, planNumber);
    addPlanItem(code, contour, planNumber);
  } catch (error) {
    showToast(code + ', გეგმა ' + planNumber + ': ' + error.message, 9000);
  }
}

// planNumber = null: ბოლო გეგმა სწრაფი გზით (ნომერი სრული სიის ჩატვირთვისას დაზუსტდება, regNo-ით)
function planSourceText(planNumber, contour) {
  return (planNumber ? 'გეგმა ' + planNumber : 'ბოლო გეგმა') + (contour.planDateMs ? ' · ' + dateFromMs(contour.planDateMs) : '') + (contour.isRaster ? ' · სურათიდან' : '');
}
function addPlanItem(code, contour, planNumber) {
  const areaText = contour.areaCalculated ? squareMeters(contour.areaCalculated) + (contour.areaInPdf ? ' (გეგმაში ' + squareMeters(contour.areaInPdf) + ')' : '') : '';
  const item = { id: Date.now(), code, planNumber, planRegNo: contour.regNo || '', contour: { planDateMs: contour.planDateMs, isRaster: contour.isRaster },
    source: planSourceText(planNumber, contour), address: '', areaText, warnings: contour.warnings || [],
    geometry: { type: 'MultiPolygon', coordinates: contour.polygons }, color: WORK_COLORS[workItems.length % WORK_COLORS.length] };
  workItems.push(item);
  numberPlanItems();
  renderWork();
  map.flyToBounds(item.layer.getBounds(), { maxZoom: 19, padding: [60, 60], duration: 0.8 });
  showToast(code + ': ' + item.source + ' დაემატა' + (item.warnings.length ? ' (იხ. გაფრთხილება სიაში).' : '.'));
}

// სრული სია თუ უკვე ჩატვირთულია: „ბოლო გეგმის“ სტრიქონებს ნომერი მივანიჭოთ
function numberPlanItems() {
  if (!planMenu || planMenu.state !== 'ready') return;
  for (const item of workItems) {
    if (item.code !== planMenu.code || item.planNumber || !item.planRegNo) continue;
    const plan = planMenu.plans.find((entry) => entry.regNo === item.planRegNo);
    if (plan) { item.planNumber = plan.planNumber; item.source = planSourceText(plan.planNumber, item.contour); }
  }
}

// კოდი რუკაზე არ არის: ჯერ ბოლო გეგმა სწრაფად, პარალელურად (ფონზე) ყველა გეგმის სია
async function addLatestPlanContour(code) {
  planMenu = { code, state: 'loading' }; // სრული სია ბოლო გეგმის შემდეგ იწყება, რომ მას არ შეეჯიბროს
  renderWork();
  try {
    const bridge = await loadPlanModule();
    const contour = await bridge.latestPlanContour(code);
    if (contour) addPlanItem(code, contour, null);
    else showToast(code + ': რუკაზეც არ არის და ბოლო თარიღებში საკადასტრო გეგმა ვერ ვიპოვე. სრული სია ქვემოთ იტვირთება.', 8000);
  } catch (error) {
    showToast(code + ', ბოლო გეგმა: ' + error.message, 9000);
  }
  openPlanMenu(code, true);
}

// ---------- სამუშაო მაგიდა: შენი ფაილები (KML, KMZ, GeoJSON, SHP) ----------
// ფაილი მხოლოდ ბრაუზერში იკითხება (js/file_import.mjs), არსად იგზავნება.
const MANY_FEATURES = 30; // ამაზე მეტი ობიექტი ერთ ფაილში -> სიაში ერთ სტრიქონად
async function addFiles(files) {
  if (!files || !files.length) return;
  showToast('ვკითხულობ ფაილებს…', 20000);
  try {
    const { importFiles } = await import('./js/file_import.mjs');
    const { items, warnings } = await importFiles(files);
    const byFile = new Map();
    for (const item of items) { if (!byFile.has(item.fileName)) byFile.set(item.fileName, []); byFile.get(item.fileName).push(item); }
    const added = [];
    for (const [fileName, list] of byFile) {
      const newItems = list.length > MANY_FEATURES
        ? [{ code: fileName, geometry: { type: 'FeatureCollection', features: list.map((entry) => ({ type: 'Feature', properties: {}, geometry: entry.geometry })) }, count: list.length }]
        : list.map((entry) => ({ code: entry.name || fileName, geometry: entry.geometry, color: entry.color })); // ფერი: ჩვენივე GeoJSON-იდან
      for (const item of newItems) {
        Object.assign(item, { id: Date.now() + Math.random(), source: 'ფაილი: ' + fileName + (item.count ? ' · ' + item.count + ' ობიექტი' : ''), address: '',
          color: item.color || WORK_COLORS[workItems.length % WORK_COLORS.length] });
        workItems.push(item); added.push(item);
      }
    }
    renderWork();
    if (added.length) map.flyToBounds(L.featureGroup(added.map((item) => item.layer)).getBounds(), { maxZoom: 18, padding: [60, 60], duration: 0.8 });
    const message = added.length ? 'დაემატა ' + items.length + ' ობიექტი (დროებით).' : 'ფაილებში რუკის ობიექტი ვერ ვიპოვე.';
    showToast(message + (warnings.length ? ' ' + warnings.join('; ') : ''), warnings.length ? 10000 : 4000);
  } catch (error) {
    showToast('ფაილი ვერ წავიკითხე: ' + error.message, 8000);
  }
}
byId('importInput').onchange = (event) => { addFiles([...event.target.files]); event.target.value = ''; }; // ასლი: value-ს გასუფთავება სიას ცარიელს ხდის
// drag and drop ნებისმიერ ადგილას გვერდზე
let dragDepth = 0;
const hasFiles = (event) => event.dataTransfer && [...event.dataTransfer.types].includes('Files');
document.addEventListener('dragenter', (event) => { if (!hasFiles(event)) return; event.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
document.addEventListener('dragover', (event) => { if (hasFiles(event)) event.preventDefault(); });
document.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) document.body.classList.remove('dragging'); });
document.addEventListener('drop', (event) => {
  if (!hasFiles(event)) return;
  event.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  addFiles(event.dataTransfer.files);
});

// ---------- პირადი რუკები: სამუშაო მაგიდის შენახვა სახელით (js/personal_maps.mjs) ----------
// Drive-თან დაკავშირებისას: მომხმარებლის საკუთარ Drive-ში, დამალულ საქაღალდეში (სხვა ვერავინ ხედავს);
// დაკავშირების გარეშე: მხოლოდ ამ ბრაუზერში. გაზიარება: ასლი ბმულის # ნაწილში (სერვერზე არაფერი ინახება).
let personal = null;          // js/personal_maps.mjs (პირველ საჭიროებაზე იტვირთება)
let currentMap = null;        // ღია რუკა: { id, storage: 'drive'|'local', name, savedText } ან null (დროებითი მაგიდა)
let sharedMap = '';           // ბმულით მიღებული რუკის სახელი (სანამ შეინახავ)
let myMaps = [];              // ბოლოს წაკითხული სია: [{ id, storage, name, codes, count, modified }]
let myMapsFilter = '';
const loadPersonal = async () => personal || (personal = await import('./js/personal_maps.mjs'));
const driveReady = () => !!(window.SERVER && window.SERVER.hasDriveToken && window.SERVER.hasDriveToken());
const sameMap = (a, b) => !!(a && b && a.storage === b.storage && a.id === b.id);
const storageText = (storage) => storage === 'drive' ? '☁ Drive' : '💻 ბრაუზერი';
const myMapsVisible = () => byId('modalBack').classList.contains('open') && !!byId('myMapList');
// შენახულიდან ჩატვირთული სტრიქონი → სამუშაო მაგიდის სტრიქონი
const itemFromSaved = (saved) => Object.assign({}, saved, { id: Date.now() + Math.random() });

function mapIsDirty() {
  return !!(currentMap && personal && personal.snapshotText(workItems) !== currentMap.savedText);
}
// მაგიდაზე ისეთი რამ არის, რაც არსად შენახულა
const workIsUnsaved = () => workItems.length > 0 && (currentMap ? mapIsDirty() : true);

function workTitleHtml() {
  if (currentMap) return '🗂 ' + escapeHtml(currentMap.name) + (mapIsDirty() ? ' <span class="dirty" title="შეუნახავი ცვლილება (💾)">● შეუნახავი</span>' : '') +
    ' <span class="where">· ' + storageText(currentMap.storage) + '</span>';
  if (sharedMap) return '🔗 ' + escapeHtml(sharedMap) + ' <span class="where">· გაზიარებული ასლი (💾 = შენახვა შენთან)</span>';
  return 'დროებითი (მხოლოდ შენთან, განახლებისას ქრება)';
}
function updateWorkTitle() {
  const element = byId('workTitleText');
  if (element) element.innerHTML = workTitleHtml();
}
function clearShared() {
  sharedMap = '';
  if (sharedHash) { sharedHash = ''; writeFiltersToUrl(); }
}
function fitWork(items) {
  const layers = items.map((item) => item.layer).filter(Boolean);
  if (!layers.length) return;
  const bounds = L.featureGroup(layers).getBounds();
  if (bounds.isValid()) map.flyToBounds(bounds, { maxZoom: 19, padding: [60, 60], duration: 0.8 });
}

// Drive-ის Google ფანჯარა ბრაუზერმა მხოლოდ დაჭერისას უნდა გახსნას: ეს დამმუშავებლის დასაწყისში, სხვა ლოდინამდე
function connectDriveNow() {
  if (!window.SERVER || !window.SERVER.connectDrive) return Promise.reject(new Error('Google Drive აქ მიუწვდომელია.'));
  return window.SERVER.connectDrive();
}

async function openMyMaps(focusSave) {
  closeMenus();
  if (window.SERVER && window.SERVER.preloadGoogle) window.SERVER.preloadGoogle();
  // ამ ბრაუზერში Drive უკვე დაკავშირებულა, ტოკენს კი ვადა გაუვიდა: ახლავე ვცდით (დაჭერის ფარგლებში)
  const connecting = !driveReady() && window.SERVER && window.SERVER.driveWasUsed && window.SERVER.driveWasUsed()
    ? connectDriveNow().catch((error) => showToast(error.message, 7000)) : null;
  renderMyMaps('loading', focusSave);
  if (connecting) await connecting;
  await refreshMyMaps(focusSave);
}
async function refreshMyMaps(focusSave) {
  try {
    const module = await loadPersonal();
    const { maps, driveError } = await module.listMaps();
    myMaps = maps;
    if (myMapsVisible()) renderMyMaps(driveError ? 'Drive-ის რუკები ვერ წავიკითხე: ' + driveError.message : '', focusSave);
  } catch (error) {
    if (myMapsVisible()) renderMyMaps(error.message, focusSave);
  }
}

function modifiedText(value) {
  const date = new Date(value);
  if (isNaN(date)) return '';
  const two = (number) => String(number).padStart(2, '0');
  return two(date.getDate()) + '.' + two(date.getMonth() + 1) + '.' + date.getFullYear() + ' ' + two(date.getHours()) + ':' + two(date.getMinutes());
}
function filteredMyMaps() {
  const words = myMapsFilter.toLowerCase().split(/\s+/).filter(Boolean);
  return myMaps.filter((entry) => words.every((word) => (entry.name + ' ' + entry.codes).toLowerCase().includes(word)));
}
function myMapListHtml(message) {
  if (message === 'loading') return '<div class="muted" style="padding:8px 0">იტვირთება…</div>';
  let html = message ? '<div class="warn">' + escapeHtml(message) + '</div>' : '';
  const list = filteredMyMaps();
  if (!myMaps.length) return html + '<div class="muted" style="padding:8px 0;font-size:13px">ჯერ არცერთი რუკა არ შეგინახავს.</div>';
  if (!list.length) return html + '<div class="muted" style="padding:8px 0;font-size:13px">ფილტრს არაფერი ემთხვევა.</div>';
  return html + list.map((entry) => '<div class="public-row map-row' + (sameMap(entry, currentMap) ? ' current' : '') + '" data-map="' + myMaps.indexOf(entry) + '">' +
    '<div class="grow"><div><b>' + escapeHtml(entry.name) + '</b>' + (sameMap(entry, currentMap) ? ' <span class="muted">· ღიაა</span>' : '') + '</div>' +
    '<div class="muted" style="font-size:12px">' + modifiedText(entry.modified) + ' · ' + entry.count + ' ობიექტი · ' + storageText(entry.storage) + '</div>' +
    (entry.codes ? '<div class="muted codes" title="' + escapeHtml(entry.codes) + '">' + escapeHtml(entry.codes) + '</div>' : '') + '</div>' +
    '<button class="icon-button" data-act="add" title="დამატება ახლანდელ სამუშაო მაგიდაზე">＋</button>' +
    '<button class="icon-button" data-act="share" title="გაზიარება ბმულით (ასლი)">🔗</button>' +
    '<button class="icon-button" data-act="file" title="ფაილად ჩამოტვირთვა (GeoJSON)">⤓</button>' +
    '<button class="icon-button" data-act="delete" title="წაშლა">✕</button></div>').join('');
}
function bindMyMapList() {
  byId('myMapList').querySelectorAll('[data-map]').forEach((row) => row.onclick = (event) => {
    const entry = myMaps[Number(row.dataset.map)];
    const action = event.target.dataset.act;
    if (action === 'add') openSavedMap(entry, true);
    else if (action === 'share') withSavedMap(entry, (document) => openShareMapDialog(document.name, document.items));
    else if (action === 'file') withSavedMap(entry, (document) => downloadMapFile(document.name, document.items));
    else if (action === 'delete') deleteSavedMap(entry);
    else openSavedMap(entry, false);
  });
}

function renderMyMaps(message, focusSave) {
  const drive = driveReady();
  const typedName = byId('myMapName') && myMapsVisible() ? byId('myMapName').value : null;
  const name = typedName !== null ? typedName : currentMap ? currentMap.name : sharedMap;
  let html = '<h3>ჩემი რუკები</h3><div class="muted" style="font-size:13px">' + (drive
    ? '☁ რუკები ინახება შენს Google Drive-ში, ამ საიტის დამალულ საქაღალდეში: ხედავ მხოლოდ შენ, ნებისმიერი მოწყობილობიდან. <a href="#" id="driveForget">Drive-იდან გასვლა</a>'
    : '💻 ახლა რუკები ინახება მხოლოდ ამ ბრაუზერში. Drive-თან დაკავშირებისას შენს Google Drive-ში შეინახება (დამალულ საქაღალდეში: სხვები ვერ ნახავენ, სხვა მოწყობილობიდანაც გაიხსნება; Sheet-ზე უფლება არ სჭირდება).') + '</div>' +
    (drive ? '' : '<div class="row-buttons" style="justify-content:flex-start;margin-top:8px"><button class="action" id="driveConnect">☁ Drive-თან დაკავშირება</button></div>');
  html += '<label class="field">სამუშაო მაგიდის შენახვა' + (workItems.length ? ' (' + workItems.length + ' ობიექტი)' : '') + '</label>';
  if (!workItems.length) html += '<div class="muted" style="font-size:13px">სამუშაო მაგიდა ცარიელია: მოძებნე კოდი რუკაზე (Enter) ან ჩააგდე ფაილი, მერე შეინახე.</div>';
  else html += '<div class="save-row"><input type="text" id="myMapName" maxlength="120" placeholder="რუკის სახელი, მაგ. ვაკის ნაკვეთები" value="' + escapeHtml(name) + '">' +
    '<button class="action primary" id="myMapSave">შენახვა</button></div>' +
    '<div class="muted" style="font-size:12px;margin-top:4px">' + (currentMap
      ? 'ანახლებს „' + escapeHtml(currentMap.name) + '“-ს (' + storageText(currentMap.storage) + '; სახელიც შეიცვლება). <a href="#" id="myMapSaveNew">ახალ რუკად შენახვა</a>'
      : 'შეინახება: ' + (drive ? '☁ Drive' : '💻 ეს ბრაუზერი')) + '</div>';
  html += '<label class="field">შენახული რუკები</label><input type="text" id="myMapFilter" placeholder="ფილტრი: სახელი ან კოდი" value="' + escapeHtml(myMapsFilter) + '">' +
    '<div id="myMapList">' + myMapListHtml(message) + '</div>' +
    '<div class="row-buttons"><button class="action" id="myMapsClose">დახურვა</button></div>';
  openModal(html);
  byId('myMapsClose').onclick = closeModal;
  if (byId('driveConnect')) byId('driveConnect').onclick = () => {
    const connecting = connectDriveNow();
    byId('driveConnect').disabled = true;
    connecting.then(() => { renderMyMaps('loading'); refreshMyMaps(); showToast('Drive დაკავშირებულია: ახალი რუკები Drive-ში შეინახება.'); },
      (error) => { showToast(error.message, 8000); if (byId('driveConnect')) byId('driveConnect').disabled = false; });
  };
  if (byId('driveForget')) byId('driveForget').onclick = (event) => {
    event.preventDefault();
    window.SERVER.forgetDrive();
    myMaps = myMaps.filter((entry) => entry.storage !== 'drive');
    renderMyMaps('');
    showToast('Drive-დან გახვედი ამ ბრაუზერში. რუკები Drive-ში რჩება.');
  };
  if (byId('myMapSave')) {
    byId('myMapSave').onclick = () => saveWorkspace(byId('myMapName').value, false);
    byId('myMapName').onkeydown = (event) => { if (event.key === 'Enter') saveWorkspace(byId('myMapName').value, false); };
  }
  if (byId('myMapSaveNew')) byId('myMapSaveNew').onclick = (event) => { event.preventDefault(); saveWorkspace(byId('myMapName').value, true); };
  byId('myMapFilter').oninput = (event) => {
    myMapsFilter = event.target.value;
    byId('myMapList').innerHTML = myMapListHtml(message === 'loading' ? 'loading' : '');
    bindMyMapList();
  };
  bindMyMapList();
  if (focusSave && byId('myMapName')) byId('myMapName').focus();
}

// შენახვა: asNew = false და რუკა ღიაა → იგივე ფაილი ახლდება; სხვა შემთხვევაში ახალი რუკა
async function saveWorkspace(nameText, asNew) {
  const name = String(nameText || '').trim();
  if (!name) { showToast('რუკის სახელი ჩაწერე.'); if (byId('myMapName')) byId('myMapName').focus(); return; }
  if (!workItems.length) { showToast('სამუშაო მაგიდა ცარიელია.'); return; }
  const updating = !!currentMap && !asNew;
  const storage = updating ? currentMap.storage : driveReady() ? 'drive' : 'local';
  const connecting = storage === 'drive' && !driveReady() ? connectDriveNow() : null; // ტოკენს ვადა გაუვიდა
  const button = byId('myMapSave');
  try {
    if (connecting) await connecting;
    const module = await loadPersonal();
    let id = updating ? currentMap.id : null;
    if (!updating) {
      const same = myMaps.find((entry) => entry.storage === storage && entry.name === name);
      if (same) {
        if (!window.confirm('„' + name + '“ უკვე არსებობს (' + storageText(storage) + '). ჩავანაცვლო?')) return;
        id = same.id;
      }
    }
    if (button) { button.disabled = true; button.textContent = 'ინახება…'; }
    const entry = await module.saveMap({ id, storage, name, items: workItems });
    currentMap = Object.assign({}, entry, { savedText: module.snapshotText(workItems) });
    myMaps = [entry].concat(myMaps.filter((other) => !sameMap(other, entry)));
    clearShared();
    renderWork();
    if (myMapsVisible()) { byId('myMapName').value = name; renderMyMaps(''); }
    showToast('„' + name + '“ შეინახა ' + (storage === 'drive' ? 'შენს Drive-ში.' : 'ამ ბრაუზერში.'));
  } catch (error) {
    showToast('შენახვა ვერ მოხერხდა: ' + error.message, 9000);
    if (myMapsVisible()) renderMyMaps('');
  }
}

// შენახული რუკის წაკითხვა (Drive-ის ვადაგასული ტოკენით: ჯერ დაკავშირება, დაჭერის ფარგლებში)
async function readSavedMap(entry) {
  const connecting = entry.storage === 'drive' && !driveReady() ? connectDriveNow() : null;
  if (connecting) await connecting;
  const module = await loadPersonal();
  return module.readMap(entry);
}
async function withSavedMap(entry, action) {
  try { action(await readSavedMap(entry)); } catch (error) { showToast('„' + entry.name + '“ ვერ წავიკითხე: ' + error.message, 9000); }
}

// add = false: სამუშაო მაგიდის ნაცვლად (რუკა „ღიაა“, შენახვა მასვე ანახლებს); add = true: არსებულს დაემატება
async function openSavedMap(entry, add) {
  if (!add && sameMap(entry, currentMap)) { closeModal(); fitWork(workItems); return; }
  if (!add && workIsUnsaved() && !window.confirm('სამუშაო მაგიდაზე შეუნახავი ობიექტებია. გავხსნა „' + entry.name + '“ მათ ნაცვლად?')) return;
  try {
    const document = await readSavedMap(entry);
    const items = document.items.map(itemFromSaved);
    if (add) {
      workItems.push(...items);
    } else {
      workItems = items;
      planMenu = null;
      currentMap = Object.assign({}, entry, { name: document.name, savedText: personal.snapshotText(items) });
      clearShared();
    }
    renderWork();
    closeModal();
    fitWork(items);
    showToast('„' + document.name + '“' + (add ? ': დაემატა ' + items.length + ' ობიექტი.' : ' გაიხსნა (' + items.length + ' ობიექტი).'));
  } catch (error) {
    showToast('„' + entry.name + '“ ვერ გაიხსნა: ' + error.message, 9000);
  }
}

async function deleteSavedMap(entry) {
  if (!window.confirm('წავშალო „' + entry.name + '“ (' + storageText(entry.storage) + ')? აღდგენა შეუძლებელია.')) return;
  const connecting = entry.storage === 'drive' && !driveReady() ? connectDriveNow() : null;
  try {
    if (connecting) await connecting;
    await (await loadPersonal()).deleteMap(entry);
    myMaps = myMaps.filter((other) => !sameMap(other, entry));
    if (sameMap(entry, currentMap)) { currentMap = null; renderWork(); } // ობიექტები მაგიდაზე რჩება, დროებით
    if (myMapsVisible()) renderMyMaps('');
    showToast('„' + entry.name + '“ წაიშალა.');
  } catch (error) {
    showToast('წაშლა ვერ მოხერხდა: ' + error.message, 9000);
  }
}

const fileSafeName = (name) => String(name || 'რუკა').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 80);
async function downloadMapFile(name, items) {
  const module = await loadPersonal();
  downloadBlob(new Blob([module.toGeoJSON(name, items)], { type: 'application/geo+json' }), fileSafeName(name) + '.geojson');
}

// გაზიარება: რუკის ასლი ბმულის # ნაწილში (სერვერზე არ იგზავნება და არსად ინახება)
async function openShareMapDialog(name, items) {
  try {
    const module = await loadPersonal();
    const count = module.cleanItems(items).length;
    if (!count) { showToast('გასაზიარებელი ობიექტი არ არის.'); return; }
    const link = location.origin + location.pathname + (contractsOn ? '' : '?contracts=0') + '#pm=' + await module.encodeShare(name, items);
    openModal('<h3>🔗 რუკის გაზიარება</h3><div class="muted" style="font-size:13px"><b>' + escapeHtml(name) + '</b>, ' + count + ' ობიექტი. ' +
      'ბმულში რუკის <b>ასლია</b>: მიმღები ნახავს ზუსტად ამას, შემდეგი ცვლილებები მასში არ აისახება. ბმული არსად ინახება: ნახავს მხოლოდ ის, ვისაც გაუგზავნი. ' +
      'ხელშეკრულებებს ბმული არ ხსნის (მათ მხოლოდ Sheet-ის უფლებით ნახავს).</div>' +
      '<div class="link-box">' + escapeHtml(link.length > 400 ? link.slice(0, 400) + '…' : link) + '</div>' +
      '<div class="muted" style="font-size:12px;margin-top:4px">' + link.length + ' სიმბოლო</div>' +
      (link.length > module.LONG_LINK ? '<div class="warn">ბმული გრძელია: ზოგმა მესენჯერმა შეიძლება ჩამოჭრას. საიმედოა ფაილი (⤓ GeoJSON): მიმღები მას რუკაზე ჩააგდებს.</div>' : '') +
      '<div class="row-buttons"><button class="action" id="shareMapClose">დახურვა</button><button class="action" id="shareMapFile">⤓ GeoJSON</button>' +
      '<button class="action primary" id="shareMapCopy">კოპირება</button></div>');
    byId('shareMapClose').onclick = closeModal;
    byId('shareMapFile').onclick = () => downloadMapFile(name, items);
    byId('shareMapCopy').onclick = () => copyText(link, 'ბმული დაკოპირდა.');
  } catch (error) {
    showToast('ბმული ვერ შეიქმნა: ' + error.message, 8000);
  }
}

// გვერდი გაზიარებული რუკის ბმულით გაიხსნა (#pm=…): ასლი სამუშაო მაგიდაზე, შენახვამდე დროებით
async function openSharedFromLink() {
  if (!sharedHash) return;
  try {
    const module = await loadPersonal();
    const document = await module.decodeShare(sharedHash.slice('#pm='.length));
    workItems = document.items.map(itemFromSaved);
    sharedMap = document.name;
    renderWork();
    fitWork(workItems);
    showToast('გაზიარებული რუკა „' + document.name + '“: ' + workItems.length + ' ობიექტი. შენთან შესანახად: 💾', 8000);
  } catch (error) {
    clearShared();
    showToast('გაზიარებული რუკა ვერ გაიხსნა: ' + error.message, 9000);
  }
}

byId('myMapsButton').onclick = () => openMyMaps(false);
window.addEventListener('beforeunload', (event) => {

// ---------- სამუშაო მაგიდიდან ხელშეკრულების ქონებაში (💾) ----------
// შეიძლება, თუ რედაქტორი ხარ და კოდი ხელშეკრულებების ქონებებშია (მთლიანი კოდი, ნაწილის გარეშე)

  return !!(mapData && mapData.canEdit && /^(Multi)?Polygon$/.test(item.geometry.type) && mapObjects.some((object) => object.code === item.code && !object.part));
}
function geometryAreaSquareMeters(geometry) {
  const polygons = geometry.type === 'Polygon' ? [geometry.coordinates] : geometry.coordinates;
  const area = (ring) => ringArea(ring.map(([lng, lat]) => L.latLng(lat, lng)));
  return polygons.reduce((total, rings) => total + area(rings[0]) - rings.slice(1).reduce((holes, ring) => holes + area(ring), 0), 0);
}
function saveWorkItemToContract(item) {
  const existing = mapObjects.find((object) => object.code === item.code && !object.part);
  if (existing && existing.geometry && !confirm(item.code + '-ს უკვე აქვს კონტური. ჩავანაცვლო ამით (' + item.source + ')?')) return;
  const area = geometryAreaSquareMeters(item.geometry);
  const source = item.source + (item.edited ? ' (შესწორებული)' : ''); // მაგ. „ms.gov.ge“, „გეგმა 2 · 12.05.2015“, „ფაილი: x.kml“
  showToast(item.code + ': ინახება…', 20000);
  callServer('saveGeometry', [item.code, '', JSON.stringify(item.geometry), area, source, item.planNumber || ''], () => {
    showToast(item.code + ': კონტური შენახულია (' + area.toFixed(1) + ' მ²).');
    refreshData();
  });
}

// ფართობი კვ. მეტრებში (სფერული მიახლოება, მცირე ნაკვეთზე საკმარისად ზუსტი)
function ringArea(latLngs) {
  const radius = 6378137;
  let total = 0;
  for (let i = 0; i < latLngs.length; i++) {
    const a = latLngs[i], b = latLngs[(i + 1) % latLngs.length];
    total += (b.lng - a.lng) * Math.PI / 180 * (2 + Math.sin(a.lat * Math.PI / 180) + Math.sin(b.lat * Math.PI / 180));
  }
  return Math.abs(total * radius * radius / 2);
}

// Apps Script-ის შაბლონი „<" + "?“-ს თავის ბრძანებად კითხულობს, ამიტომ XML-ის თავი ნაწილებად იწყობა
const XML_HEAD = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?' + '>';
// ---------- არეალი ----------
// არეალში მოხვედრა: ობიექტის ცენტრი ან კონტურის რომელიმე წვერო არეალის შიგნითაა
function pointInPolygon(lat, lng, polygon) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const [latI, lngI] = polygon[i], [latJ, lngJ] = polygon[j];
    if ((latI > lat) !== (latJ > lat) && lng < (lngJ - lngI) * (lat - latI) / (latJ - latI) + lngI) inside = !inside;
  }
  return inside;
}

const inArea = (lat, lng) => areaPolygon.some((ring) => pointInPolygon(lat, lng, ring));
function objectInArea(object) {
  if (!object.centroid) return false;
  if (inArea(object.centroid.lat, object.centroid.lng)) return true;
  if (!object.geometry) return false;
  const polygons = object.geometry.type === 'MultiPolygon' ? object.geometry.coordinates : [object.geometry.coordinates];
  return polygons.some((rings) => rings[0].some(([lng, lat]) => inArea(lat, lng)));
}

// GeoJSON გეომეტრიის გარე რგოლები [[lat, lng], ...] სახით (ხვრელები არ ითვლება)
function outerRingsOf(geometry) {
  if (!geometry) return [];
  if (geometry.type === 'Polygon') return [geometry.coordinates[0].map(([lng, lat]) => [lat, lng])];
  if (geometry.type === 'MultiPolygon') return geometry.coordinates.map((polygon) => polygon[0].map(([lng, lat]) => [lat, lng]));
  if (geometry.type === 'GeometryCollection') return geometry.geometries.flatMap(outerRingsOf);
  if (geometry.type === 'Feature') return outerRingsOf(geometry.geometry);
  if (geometry.type === 'FeatureCollection') return geometry.features.flatMap(outerRingsOf);
  return [];
}

// ბმულისთვის: 5 ციფრი (~1 მ); ძალიან ბევრი წვეროს შემთხვევაში ყოველი მე-k (ბმული მოკლე რომ დარჩეს)
const AREA_URL_POINTS = 400;
function areaToText(rings) {
  const total = rings.reduce((sum, ring) => sum + ring.length, 0);
  const step = Math.max(1, Math.ceil(total / AREA_URL_POINTS));
  return rings.map((ring) => ring.filter((point, index) => index % step === 0 || index === ring.length - 1)
    .map(([lat, lng]) => lat.toFixed(5) + ',' + lng.toFixed(5)).join(';')).join('|');
}

// points: ერთი რგოლი [[lat, lng], ...] ან რგოლების სია; label: ღილაკის სახელი (მაგ. ფაილის ობიექტი)
function setArea(points, silent, label) {
  const rings = !points || !points.length ? [] : (typeof points[0][0] === 'number' ? [points] : points);
  const valid = rings.filter((ring) => ring.length >= 3 && ring.every((point) => point.length === 2 && point.every(Number.isFinite)));
  areaPolygon = valid.length ? valid : null;
  areaLabel = areaPolygon ? label || '' : '';
  if (areaLayer) { areaLayer.remove(); areaLayer = null; }
  if (areaPolygon) {
    areaLayer = L.polygon(areaPolygon, { color: '#2563eb', weight: 2, dashArray: '8 6', fillColor: '#2563eb', fillOpacity: 0.06, interactive: false }).addTo(map);
  }
  byId('areaButton').classList.toggle('active', !!areaPolygon);
  if (silent) return;
  buildFilterControls();
  render();
}

// ---------- ექსპორტი (სიაში არსებული ობიექტები: ფილტრები + არეალი) ----------
function exportRows() {
  return renderedObjects.map((object) => {
    const view = object.view;
    const contracts = view.entries.map((entry) => entry.contract);
    const unique = (values) => Array.from(new Set(values.filter(Boolean))).join('; ');
    const periods = view.entries.map((entry) => {
      const period = historyRowPeriod(entry.row);
      return formatDate(period.from) + ' – ' + (period.to || entry.contract.end ? formatDate(period.to || entry.contract.end) : 'უვადო');
    });
    const restrictions = restrictionsAt(object, filterState.date).map((row) => row.condition);
    let area = '';
    if (object.geometry && object.geometry.type === 'Polygon') area = Math.round(ringArea(object.geometry.coordinates[0].map(([lng, lat]) => ({ lat, lng }))) * 10) / 10;
    return {
      'კოდი': object.code, 'ნაწილი': object.part, 'სტატუსი': view.main.status, 'ხელშეკრულების სტატუსი': view.main.contractStatus,
      'ხელშეკრულება': unique(contracts.map((c) => c.id)), 'ნომერი': unique(contracts.map((c) => c.number)),
      'ტიპი': unique(contracts.map((c) => c.type)), 'მხარე': unique(contracts.map((c) => c.party)), 'პერიოდი': unique(periods),
      'შეზღუდვა': restrictions.join('; '), 'ნიშნები': unique(view.flags.map((row) => row.flag)), 'ფართობი (მ², რუკით)': area,
      'განედი': object.centroid ? Number(object.centroid.lat.toFixed(7)) : '', 'გრძედი': object.centroid ? Number(object.centroid.lng.toFixed(7)) : '',
    };
  });
}

function exportFileName(extension) {
  return 'ხელშეკრულებები_' + filterState.date + (areaPolygon ? '_არეალი' : '') + '.' + extension;
}

function downloadBlob(blob, fileName) {
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  setTimeout(() => { URL.revokeObjectURL(link.href); link.remove(); }, 2000);
}

// KML: თითო ობიექტი = Placemark (კონტური ან წერტილი), ფერი სტატუსისა
function buildKml() {
  const xml = (text) => String(text == null ? '' : text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const kmlColor = (hex, alpha) => { const h = hex.replace('#', ''); return alpha + h.slice(4, 6) + h.slice(2, 4) + h.slice(0, 2); };
  const ring = (coordinates) => '<LinearRing><coordinates>' + coordinates.map(([lng, lat]) => lng + ',' + lat + ',0').join(' ') + '</coordinates></LinearRing>';
  const polygonKml = (rings) => '<Polygon><outerBoundaryIs>' + ring(rings[0]) + '</outerBoundaryIs>' + rings.slice(1).map((r) => '<innerBoundaryIs>' + ring(r) + '</innerBoundaryIs>').join('') + '</Polygon>';
  const rows = exportRows();
  let placemarks = '';
  renderedObjects.forEach((object, index) => {
    const color = object.view.color;
    const style = '<Style><LineStyle><color>' + kmlColor(color, 'ff') + '</color><width>2</width></LineStyle><PolyStyle><color>' + kmlColor(color, '80') + '</color></PolyStyle>' +
      '<IconStyle><color>' + kmlColor(color, 'ff') + '</color></IconStyle></Style>';
    const description = Object.entries(rows[index]).filter(([, value]) => value !== '').map(([key, value]) => key + ': ' + value).join('\n');
    let geometry = '';
    if (object.geometry) {
      const polygons = object.geometry.type === 'MultiPolygon' ? object.geometry.coordinates : [object.geometry.coordinates];
      geometry = polygons.length > 1 ? '<MultiGeometry>' + polygons.map(polygonKml).join('') + '</MultiGeometry>' : polygonKml(polygons[0]);
    } else if (object.centroid) {
      geometry = '<Point><coordinates>' + object.centroid.lng + ',' + object.centroid.lat + ',0</coordinates></Point>';
    } else return;
    placemarks += '<Placemark><name>' + xml(objectTitle(object)) + '</name><description>' + xml(description) + '</description>' + style + geometry + '</Placemark>\n';
  });
  return XML_HEAD + '\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>' + xml(exportFileName('kml')) + '</name>\n' + placemarks + '</Document></kml>\n';
}

// ---------- მინიმალური .xlsx (ZIP შეკუმშვის გარეშე), გარე ბიბლიოთეკის გარეშე ----------
function buildXlsx(rows) {
  const xml = (text) => String(text == null ? '' : text).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const headers = Object.keys(rows[0]);
  const columnName = (index) => { let name = ''; index++; while (index) { const r = (index - 1) % 26; name = String.fromCharCode(65 + r) + name; index = Math.floor((index - 1) / 26); } return name; };
  const cell = (value, rowNumber, columnIndex, bold) => {
    const ref = columnName(columnIndex) + rowNumber;
    if (typeof value === 'number') return '<c r="' + ref + '"><v>' + value + '</v></c>';
    return '<c r="' + ref + '" t="inlineStr"' + (bold ? ' s="1"' : '') + '><is><t xml:space="preserve">' + xml(value) + '</t></is></c>';
  };
  let sheetRows = '<row r="1">' + headers.map((header, i) => cell(header, 1, i, true)).join('') + '</row>';
  rows.forEach((row, r) => { sheetRows += '<row r="' + (r + 2) + '">' + headers.map((header, i) => cell(row[header], r + 2, i)).join('') + '</row>'; });
  const widths = headers.map((header, i) => '<col min="' + (i + 1) + '" max="' + (i + 1) + '" width="' + Math.min(45, Math.max(12, header.length + 4, ...rows.map((row) => String(row[header]).length + 2))) + '" customWidth="1"/>').join('');
  const files = {
    '[Content_Types].xml': XML_HEAD + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels': XML_HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml': XML_HEAD + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="ობიექტები" sheetId="1" r:id="rId1"/></sheets></workbook>',
    'xl/_rels/workbook.xml.rels': XML_HEAD + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml': XML_HEAD + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="2"><xf/><xf fontId="1" applyFont="1"/></cellXfs></styleSheet>',
    'xl/worksheets/sheet1.xml': XML_HEAD + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>' + widths + '</cols><sheetData>' + sheetRows + '</sheetData></worksheet>',
  };
  return new Blob([zipStore(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

// ZIP არქივი შეკუმშვის გარეშე („stored“), CRC32-ით
function zipStore(files) {
  const encoder = new TextEncoder();
  const crcTable = Array.from({ length: 256 }, (_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc32 = (bytes) => { let c = 0xFFFFFFFF; for (const b of bytes) c = crcTable[(c ^ b) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const parts = [], central = [];
  let offset = 0;
  for (const [name, text] of Object.entries(files)) {
    const nameBytes = encoder.encode(name), data = encoder.encode(text), crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true); local.setUint16(4, 20, true); local.setUint16(6, 0x0800, true);
    local.setUint32(14, crc, true); local.setUint32(18, data.length, true); local.setUint32(22, data.length, true); local.setUint16(26, nameBytes.length, true);
    parts.push(new Uint8Array(local.buffer), nameBytes, data);
    const header = new DataView(new ArrayBuffer(46));
    header.setUint32(0, 0x02014b50, true); header.setUint16(4, 20, true); header.setUint16(6, 20, true); header.setUint16(8, 0x0800, true);
    header.setUint32(16, crc, true); header.setUint32(20, data.length, true); header.setUint32(24, data.length, true); header.setUint16(28, nameBytes.length, true);
    header.setUint32(42, offset, true);
    central.push(new Uint8Array(header.buffer), nameBytes);
    offset += 30 + nameBytes.length + data.length;
  }
  const centralSize = central.reduce((sum, part) => sum + part.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, Object.keys(files).length, true); end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, centralSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)]);
}

// ---------- საჯარო View-ები ----------
// საჯარო ბმული Google ანგარიშს არ ითხოვს, ამიტომ მას მთელი Sheet არ ეძლევა: გამოქვეყნებისას
// ვინახავთ მხოლოდ ამ ხედში ნაჩვენები ობიექტების ასლს, საფუძვლების, ნომრებისა და შენიშვნების გარეშე.
// options: showParty (მხარის სახელი), withHistory (false = მხოლოდ ამ თარიღის მდგომარეობა), withFlags (ნიშნები)
function buildPublicSnapshot(options) {
  const date = filterState.date;
  const contractIds = new Set();
  const objects = renderedObjects;
  objects.forEach((object) => object.view.entries.forEach((entry) => contractIds.add(entry.row.contract)));
  const objectKeys = new Set(objects.map((object) => object.key));
  const codes = new Set(objects.map((object) => object.code));
  const activeRows = new Set(objects.flatMap((object) => object.view.entries.map((entry) => entry.row)));
  const activeAt = (row) => row.from && row.from <= date && !(row.to && row.to <= date);
  let history = mapData.history.filter((row) => objectKeys.has(objectKey(row.code, row.part)) && contractIds.has(row.contract));
  let statusChanges = mapData.statusChanges.filter((change) => contractIds.has(change.contract)).map((change) => ({ contract: change.contract, date: change.date, status: change.status, basis: '' }));
  let restrictions = mapData.restrictions.filter((row) => objectKeys.has(objectKey(row.code, row.part)));
  let flags = options.withFlags ? mapData.flags.filter((row) => contractIds.has(row.contract)) : [];
  if (!options.withHistory) {
    // მხოლოდ ამ დღის სურათი: მოქმედი ჩანაწერები და თითო ხელშეკრულებაზე ერთი (მიმდინარე) სტატუსი
    history = history.filter((row) => activeRows.has(row));
    statusChanges = Array.from(contractIds).map((id) => ({ contract: id, date, status: contractStatusAt(id, date), basis: '' }));
    restrictions = restrictions.filter((row) => activeAt({ from: row.from || contractStart(contractsById[row.contract]), to: row.to }));
    flags = flags.filter(activeAt);
  }
  return {
    contracts: mapData.contracts.filter((c) => contractIds.has(c.id)).map((c) => ({
      id: c.id, type: c.type, party: options.showParty ? c.party : '', number: '', signed: c.signed, start: c.start, end: c.end, note: '', autoEnd: c.autoEnd || null })),
    statusChanges,
    history: history.map((row) => ({ contract: row.contract, code: row.code, part: row.part, from: row.from, to: row.to, endKind: row.endKind || '', ownEnd: row.ownEnd, basis: '', plan: '' })),
    restrictions: restrictions.map((row) => ({
      code: row.code, part: row.part, contract: contractIds.has(row.contract) ? row.contract : '', condition: row.condition,
      from: row.from, to: row.to, basis: '', endBasis: '', endKind: row.endKind })),
    flags: flags.map((row) => ({ contract: row.contract, flag: row.flag, from: row.from, to: row.to, basis: '', note: '' })),
    flagTypes: options.withFlags ? mapData.flagTypes : [],
    statuses: mapData.statuses,
    // ობიექტის კონტური + მთლიანი კოდის კონტური (ნაწილის პინისთვის)
    geometries: mapData.geometries.filter((row) => objectKeys.has(objectKey(row.code, row.part)) || (!row.part && codes.has(String(row.code)))).map((row) => ({
      code: row.code, part: row.part, geojson: row.geojson, area: row.area })),
    views: [],
    fixedDate: options.withHistory ? '' : date,
    filter: filtersToQuery().toString(),
  };
}

function openModal(html) { byId('modal').innerHTML = html; byId('modalBack').classList.add('open'); }
function closeModal() { byId('modalBack').classList.remove('open'); }
byId('modalBack').addEventListener('click', (event) => { if (event.target.id === 'modalBack') closeModal(); });

function openPublishDialog() {
  const count = renderedObjects.length;
  if (!count) { showToast('ამ ხედში ობიექტი არ არის, გასაზიარებელი არაფერია.'); return; }
  let days = 7;
  const choices = [[1, '1 დღე'], [7, '7 დღე'], [30, '30 დღე'], [0, 'უვადოდ']];
  openModal('<h3>საჯაროდ გაზიარება</h3>' +
    '<div class="muted" style="font-size:13px">ბმულს Google ანგარიში არ სჭირდება. გაზიარდება მხოლოდ ამ ხედის ' + count + ' ობიექტი, ' +
    'ამჟამინდელი მდგომარეობით (ასლი). საფუძვლები, ნომრები და შენიშვნები არ გაიცემა.</div>' +
    '<label class="field">სახელი (ნახავს ბმულის მიმღებიც)</label><input type="text" id="publishName" placeholder="მაგ. აქტიური იჯარები რუსთაველზე">' +
    '<label class="field">ვადა</label><div class="segment" id="publishDays">' +
    choices.map(([value, label]) => '<button class="chip' + (value === days ? '' : ' off') + '" data-days="' + value + '">' + label + '</button>').join('') + '</div>' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13.5px"><input type="checkbox" id="publishParty"> მხარის (მოიჯარის და ა.შ.) სახელიც გამოჩნდეს</label>' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13.5px"><input type="checkbox" id="publishHistory"> ისტორიაც (თარიღის ზოლით); მოუნიშნავი = მხოლოდ ' + formatDate(filterState.date) + '-ის მდგომარეობა</label>' +
    (mapData.flags.length ? '<label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13.5px"><input type="checkbox" id="publishFlags"> ნიშნებიც (დავალიანება, დარღვევა…)</label>' : '') +
    '<div class="row-buttons"><button class="action" id="publishCancel">გაუქმება</button><button class="action primary" id="publishGo">გამოქვეყნება</button></div>');
  byId('publishName').focus();
  byId('publishDays').querySelectorAll('[data-days]').forEach((button) => button.onclick = () => {
    days = Number(button.dataset.days);
    byId('publishDays').querySelectorAll('[data-days]').forEach((other) => other.classList.toggle('off', other !== button));
  });
  byId('publishCancel').onclick = closeModal;
  byId('publishGo').onclick = () => {
    const name = byId('publishName').value.trim();
    if (!name) { byId('publishName').focus(); showToast('სახელი ჩაწერე.'); return; }
    const snapshot = buildPublicSnapshot({ showParty: byId('publishParty').checked, withHistory: byId('publishHistory').checked, withFlags: !!(byId('publishFlags') && byId('publishFlags').checked) });
    byId('publishGo').disabled = true; byId('publishGo').textContent = 'ქვეყნდება…';
    callServer('publishView', [name, days, byId('publishParty').checked, JSON.stringify(snapshot)], (result) => {
      openModal('<h3>✓ გამოქვეყნდა</h3><div class="muted" style="font-size:13px">' + escapeHtml(name) + ' · ' +
        (result.expires ? 'მოქმედებს ' + formatDate(result.expires) + '-მდე' : 'უვადოდ') + '. გაუქმება: გაზიარება → საჯარო ბმულების მართვა.</div>' +
        '<div class="link-box" id="publicLinkBox">' + escapeHtml(result.link) + '</div>' +
        '<div class="row-buttons"><button class="action" id="publicClose">დახურვა</button><a class="action" href="' + escapeHtml(result.link) + '" target="_blank" rel="noopener">გახსნა ↗</a>' +
        '<button class="action primary" id="publicCopy">კოპირება</button></div>');
      byId('publicClose').onclick = closeModal;
      byId('publicCopy').onclick = () => copyText(result.link, 'საჯარო ბმული დაკოპირდა.');
    });
  };
}

function openPublicList() {
  openModal('<h3>საჯარო ბმულები</h3><div class="muted">იტვირთება…</div>');
  callServer('listPublicViews', [], (views) => {
    const rows = (views || []).slice().reverse().map((view, index) =>
      '<div class="public-row"><div class="grow"><div class="' + (view.active ? '' : 'off') + '">' + escapeHtml(view.name) + '</div>' +
      '<div class="muted" style="font-size:12px">' + (view.active ? (view.expires ? 'მოქმედებს ' + formatDate(view.expires) + '-მდე' : 'უვადო') : 'აღარ მოქმედებს') + '</div></div>' +
      (view.active ? '<button class="action" data-copy="' + index + '">ბმული</button><button class="action" data-stop="' + index + '">გაუქმება</button>' : '') + '</div>');
    const list = (views || []).slice().reverse();
    openModal('<h3>საჯარო ბმულები</h3>' + (rows.length ? rows.join('') : '<div class="muted">ჯერ არაფერი გამოქვეყნებულა.</div>') +
      '<div class="row-buttons"><button class="action" id="publicListClose">დახურვა</button></div>');
    byId('publicListClose').onclick = closeModal;
    byId('modal').querySelectorAll('[data-copy]').forEach((button) => button.onclick = () => copyText(list[Number(button.dataset.copy)].link, 'ბმული დაკოპირდა.'));
    byId('modal').querySelectorAll('[data-stop]').forEach((button) => button.onclick = () => {
      const view = list[Number(button.dataset.stop)];
      button.disabled = true;
      callServer('unpublishView', [view.token], () => { showToast('„' + view.name + '“ გაუქმდა: ბმული აღარ გაიხსნება.'); openPublicList(); });
    });
  });
}

// ---------- სერვერთან კავშირი ----------
function callServer(name, args, onSuccess) {
  if (window.LOCAL_SERVER) { onSuccess(window.LOCAL_SERVER[name].apply(null, args)); return; } // ლოკალური ტესტი
  Promise.resolve().then(() => window.SERVER[name].apply(null, args)).then(onSuccess, (error) => {
    byId('loading').style.display = 'none';
    if (name === 'getPublicView') { byId('loading').style.display = 'flex'; byId('loading').textContent = (error && error.message) || 'ბმული აღარ მოქმედებს.'; return; }
    showToast('შეცდომა: ' + (error && error.message ? error.message : error), 8000);
  });
}

// ---------- ჩატვირთვა ----------
// Sheet-ის ახალი მდგომარეობის ძალით წაკითხვა (ქეშის გვერდის ავლით); ფილტრები და რუკის ხედი რჩება
function refreshData() {
  byId('loading').style.display = 'flex';
  callServer('getMapData', [true], (data) => {
    const keep = Object.fromEntries(filtersToQuery());
    const selectedKey = selectedObject ? selectedObject.key : null;
    prepareData(data);
    applyQuery(keep);
    buildFilterControls();
    selectedObject = selectedKey ? mapObjects.find((object) => object.key === selectedKey) || null : null;
    render();
    byId('loading').style.display = 'none';
    showToast('მონაცემი განახლდა.');
  });
}

function start(parameters) {
  const publicMode = !!window.PUBLIC_TOKEN;
  callServer(publicMode ? 'getPublicView' : 'getMapData', publicMode ? [window.PUBLIC_TOKEN] : [], (data) => {
    if (!data) { byId('loading').textContent = 'ეს საჯარო ბმული აღარ მოქმედებს.'; return; }
    prepareData(data);
    if (publicMode) {
      document.body.classList.add('public-mode');
      if (data.fixedDate) document.body.classList.add('fixed-date');
      const expires = data.publicInfo.expires;
      // ტელეფონზე მხოლოდ 🌐 ჩანს; შეხებით სრული ტექსტი
      byId('publicBanner').innerHTML = '🌐<span class="full"> <b>' + escapeHtml(data.publicInfo.name) + '</b>' +
        ' · საჯარო ხედი' + (data.fixedDate ? ', მდგომარეობა ' + formatDate(data.fixedDate) + '-ით' : '') + (expires ? ', ბმული მოქმედებს ' + formatDate(expires) + '-მდე' : '') + '</span>';
      byId('publicBanner').classList.add('compact');
      byId('publicBanner').title = 'საჯარო ხედი' + (expires ? ', მოქმედებს ' + formatDate(expires) + '-მდე' : '');
      byId('publicBanner').onclick = () => byId('publicBanner').classList.toggle('expanded');
      // ბმულში საკუთარი პარამეტრები თუ არ არის, ავტორის დაყენებული ფილტრი ჩაირთოს
      const own = Object.keys(parameters || {}).filter((key) => key !== 'view');
      if (!own.length && data.filter) parameters = Object.fromEntries(new URLSearchParams(data.filter));
    }
    if (data.noAccess) {
      // ხელშეკრულებების გარეშე: სუფთა რუკა (ფენები, საკადასტრო ფენა, ძებნა რუკაზე)
      document.body.classList.add('public-mode');
      byId('publicBanner').innerHTML = data.noAccess === 'anonymous'
        ? 'ხელშეკრულებები არ ჩანს: შესვლის გარეშე ხარ. <a href="#" id="bannerSignIn">შესვლა</a>'
        : 'ხელშეკრულებები არ ჩანს: Sheet შენთვის გაზიარებული არ არის.';
      if (byId('bannerSignIn')) byId('bannerSignIn').onclick = (event) => { event.preventDefault(); location.reload(); };
    }
    applyQuery(parameters || {});
    buildFilterControls();
    render();
    byId('loading').style.display = 'none';
    if (isPhone()) byId('results').classList.add('collapsed');
    if (!(parameters && parameters.map) && !sharedHash && renderedObjects.some((object) => object.centroid)) {
      map.fitBounds(L.latLngBounds(renderedObjects.filter((object) => object.centroid).map((object) => object.centroid)).pad(0.15));
    }
    openSharedFromLink();
  });
}

start(Object.fromEntries(new URLSearchParams(location.search)));
